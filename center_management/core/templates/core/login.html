{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login — Center Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center" style="margin-top: 80px;">
    <div class="col-md-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2 fw-bold">Center Management System</h3>
                    <p class="text-muted small">Center Management System</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
                <hr>
                <p class="text-center text-muted small mb-0">
                    Don't have an account?
                    <a href="{% url 'core:signup' %}">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
