{% extends 'core/base.html' %}
{% block title %}Confirm Delete — Center Management System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> Confirm Delete
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash text-danger" style="font-size:3rem;"></i>
                <h5 class="mt-3">Are you sure you want to delete?</h5>
                <p class="text-muted">
                    <strong>{{ object_name }}</strong>
                </p>
                <p class="text-danger small">This action cannot be undone.</p>
                <form method="post" class="d-flex justify-content-center gap-3 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                    <a href="{% url cancel_url %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
