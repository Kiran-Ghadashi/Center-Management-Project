{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign Up — Center Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center" style="margin-top: 60px;">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2 fw-bold">Create Account</h3>
                    <p class="text-muted small">Register as center staff or owner</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success w-100 mt-3 py-2">
                        <i class="bi bi-person-check"></i> Create Account
                    </button>
                </form>
                <hr>
                <p class="text-center text-muted small mb-0">
                    Already have an account?
                    <a href="{% url 'core:login' %}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
